name: Auto Update Music Index

on:
  push:
    paths:
      - 'music/**' # 只有当你往 music 文件夹上传或修改音乐文件时才触发

jobs:
  update-index:
    runs-on: ubuntu-latest
    
    # 核心：赋予 GitHub Actions 对仓库的写入权限，解决 403 报错
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install mutagen

      - name: Run index generator
        run: python generate_index.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update library.json via GitHub Actions"
          file_pattern: library.json
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
